<!DOCTYPE html>
<html lang="as">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VORTEX Playground — নিজস্ব WASM Backend</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Noto Sans Bengali", "Noto Sans Assamese", sans-serif;
    background: #0d1117; color: #e6edf3; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 24px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  h1 span { color: #f778ba; }
  .sub { color: #8b949e; font-size: 0.9rem; margin-bottom: 20px; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; width: 100%; max-width: 1100px; }
  @media (max-width: 800px) { .wrap { grid-template-columns: 1fr; } }
  .panel { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px; }
  .panel h2 { font-size: 0.85rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  textarea {
    width: 100%; height: 340px; background: #0d1117; color: #e6edf3;
    border: 1px solid #30363d; border-radius: 8px; padding: 12px;
    font-family: ui-monospace, "Noto Sans Bengali", monospace; font-size: 0.95rem;
    resize: vertical; line-height: 1.5;
  }
  textarea:focus { outline: 1px solid #f778ba; }
  #out {
    background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
    padding: 12px; height: 340px; overflow: auto; white-space: pre-wrap;
    font-family: ui-monospace, monospace; font-size: 0.95rem; line-height: 1.5;
  }
  .err { color: #f85149; }
  .btns { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
  button {
    background: #238636; color: white; border: none; border-radius: 8px;
    padding: 10px 22px; font-size: 1rem; cursor: pointer; font-weight: 600;
  }
  button:hover { background: #2ea043; }
  #status { color: #8b949e; font-size: 0.85rem; }
  input[type=file] { display: none; }
  label.btn {
    background: #21262d; border: 1px solid #30363d; color: #e6edf3;
    padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 0.95rem;
  }
  .foot { margin-top: 18px; color: #8b949e; font-size: 0.8rem; text-align: center; }
</style>
</head>
<body>
  <h1>VORTEX <span>🌀</span> Playground</h1>
  <div class="sub">নিজস্ব ভাষা → নিজস্ব compiler → নিজস্ব WebAssembly backend — কোনো LLVM/monaco/third-party নেই</div>

  <div class="wrap">
    <div class="panel">
      <h2>উৎস (source .vx)</h2>
      <textarea id="src" spellcheck="false">fn যোগ(x, y) {
    return x + y;
}

let a = [১, ২, ৩];
push(a, ৪);

for x in a {
    show(x);
}

let m = {"নাম": "ৰাম", "ভাষা": "অসমীয়া"};
show(m["নাম"] + " — " + m["ভাষা"]);
show("যোগফল: " + যোগ(২, ৩));</textarea>
      <div class="btns">
        <button id="run">▶ চালাও (Run)</button>
        <label class="btn" for="wasmfile">.wasm লোড করো</label>
        <input type="file" id="wasmfile" accept=".wasm">
        <span id="status"></span>
      </div>
    </div>
    <div class="panel">
      <h2>আউটপুট (output)</h2>
      <div id="out">(এখনো চালানো হয়নি)</div>
    </div>
  </div>

  <div class="foot">
    <code>vortexc wasm file.vx -o file.wasm</code> দিয়ে বানানো বাইনারি এখানে লোড করো।
    Export: <code>memory</code>, <code>vortex_main()</code>, <code>vortex_output()</code>
  </div>

<script>
const $out = document.getElementById('out');
const $status = document.getElementById('status');
let wasmBytes = null;

document.getElementById('wasmfile').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  wasmBytes = new Uint8Array(await f.arrayBuffer());
  $status.textContent = `✓ ${f.name} (${wasmBytes.length} bytes) লোড হয়েছে`;
});

document.getElementById('run').addEventListener('click', async () => {
  $out.textContent = '';
  if (!wasmBytes) {
    $out.innerHTML = '<span class="err">প্রথমে .wasm ফাইল লোড করো —\n\nতৈরি করো:\n  vortexc wasm file.vx -o file.wasm\n\nতারপর ".wasm লোড করো" বোতামে এখানে আনো।\n\n(ভবিষ্যতে নিজস্ব compiler ব্রাউজারেই WASM বানাবে — roadmap Phase 2)</span>';
    return;
  }
  try {
    const { instance } = await WebAssembly.instantiate(wasmBytes, {});
    const E = instance.exports;
    E.vortex_main();
    const ptr = Number(E.vortex_output());
    const mem = new DataView(E.memory.buffer);
    const len = mem.getInt32(ptr, true);
    const text = new TextDecoder().decode(new Uint8Array(E.memory.buffer, ptr + 8, len));
    $out.textContent = text || '(খালি আউটপুট)';
  } catch (err) {
    $out.innerHTML = '<span class="err">✗ ' + String(err).replace(/</g,'&lt;') + '</span>';
  }
});
</script>
</body>
</html>
