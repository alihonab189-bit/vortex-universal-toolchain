[package]
name = "vortexc"
version = "0.2.0"
edition = "2021"
description = "VORTEX Universal Toolchain — own language, compiler (VIR), VM, WASM backend, AI engine, package manager, debugger, formatter, linter, test runner. Zero third-party crates."
authors = ["alihonab189-bit"]

[lib]
name = "vortexc"
path = "src/lib.rs"

[[bin]]
name = "vortexc"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
